<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey Pox: The Durban Outbreak</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<header class="main-header">
    <div class="container">
        <h3 class="header-title text-center">Monkey Pox: The Durban Outbreak</h3>
    </div>
</header>

<div class="main-content">
    <div class="container-fluid h-100">
        <div class="row h-100">
            <!-- Game map column -->
            <div class="col-md-6 scrollable-column">
                <div class="picture-grid">
                    <div class="picture-holder" data-position="0,0" id="img01">
                        <img id="img1" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                    </div>
                    <div class="picture-holder" data-position="0,1" id="img02">
                        <img id="img2" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                    </div>
                    <div class="picture-holder" data-position="0,2" id="img03">
                        <img id="img3" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                    </div>
                    <div class="picture-holder" data-position="1,0" id="img04">
                        <img id="img4" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                    </div>
                    <div class="picture-holder" data-position="1,1" id="center-block">
                        <img id="img5" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                        <img src="Assets/Survivor-01-01.svg" alt="Survivor" class="survivor">
                    </div>
                    <div class="picture-holder" data-position="1,2" id="img06">
                        <img id="img6" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                    </div>
                    <div class="picture-holder" data-position="2,0" id="img07">
                        <img id="img7" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                    </div>
                    <div class="picture-holder" data-position="2,1" id="img08">
                        <img id="img8" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                    </div>
                    <div class="picture-holder" data-position="2,2" id="img09">
                        <img id="img9" src="Assets/Apartment-01.svg" alt="Apartment" class="apartment">
                    </div>
                </div>
            </div>

            <!-- Controls column -->
            <div class="col-md-6 scrollable-column">
                <div class="game-stats">
                    <div class="d-flex justify-content-between">
                        <div><strong>HP:</strong> <span id="hp"></span></div>
                        <div><strong>XP:</strong> <span id="xp"></span></div>
                        <div><strong>Stamina:</strong> <span id="stamina"></span></div>
                    </div>
                    <div><strong>Inventory:</strong> <span id="inventory"></span></div>
                    <div><strong>Weapons:</strong> <span id="weapons_list"></span></div>
                    <div><strong>Armed:</strong> <span id="weapon_in_hand"></span></div>
                </div>

                <div class="action-panel">
                    <h5 class="mb-2">Actions</h5>
                    <div class="d-flex mb-3">
                        <button class="action-button" onclick="fortifyAction()">
                            <img class="action-images" src="Assets/fortify-01.svg" alt="fortify">
                        </button>
                        <button class="action-button" onclick="breakAction()">
                            <img class="action-images" src="Assets/break-01.svg" alt="break">
                        </button>
                        <button class="action-button" onclick="sendInputCommand('tag')">
                            <img class="action-images" src="Assets/spray.png" alt="tag">
                        </button>
                        <button class="action-button" onclick="sendInputCommand('take')">
                            <img class="action-images" src="Assets/take-01.svg" alt="take">
                        </button>
                        <button class="action-button" onclick="sendInputCommand('use')">
                            <img class="action-images" src="Assets/use-01.svg" alt="use">
                        </button>
                        <button class="action-button" onclick="sendInputCommand('drop')">
                            <img class="action-images" src="Assets/drop-01.svg" alt=drop>
                        </button>
                        <button class="action-button" onclick="sendInputCommand('hit')">
                            <img class="action-images" src="Assets/sword.png" alt="hit">
                        </button>
                        <button class="action-button" onclick="sendInputCommand('pickup')">
                            <img class="action-images" src="Assets/pickweapon-01.svg" alt="pickup">
                        </button>
                        <button class="action-button" onclick="sendInputCommand(''load)">
                            <img class="action-images" src="Assets/load-01.svg" alt="load">
                        </button>
                        <button class="action-button" onclick="sendInputCommand('arm')">
                            <img class="action-images" src="Assets/arm-01.svg" alt="arm">
                        </button>
                        <button class="action-button" onclick="sendInputCommand('lose')">
                            <img class="action-images" src="Assets/dropweapon-01.svg" alt="lose">
                        </button>
                        <button class="action-button" onclick="sendInputCommand('stow')">
                            <img class="action-images" src="Assets/stow-01.svg" alt="stow">
                        </button>
                    </div>

<!--                    <div class="form-group">-->
<!--                        <label for="command">Command:</label>-->
<!--                        <select id="command" class="form-control form-control-sm">-->
<!--                            <option value="tag">Tag</option>-->
<!--                            <option value="take">Pick up Item</option>-->
<!--                            <option value="use">Use</option>-->
<!--                            <option value="drop">Drop</option>-->
<!--                            <option value="hit">Attack</option>-->
<!--                            <option value="pickup">Pickup Weapon</option>-->
<!--                            <option value="load">Load</option>-->
<!--                            <option value="arm">Arm Weapon</option>-->
<!--                            <option value="lose">Drop Weapon</option>-->
<!--                            <option value="stow">Stow Weapon</option>-->
<!--                        </select>-->
<!--                    </div>-->

                    <div class="form-group">
                        <label for="arguments">Arguments:</label>
                        <input type="text" id="arguments" class="form-control form-control-sm" placeholder="Comma-separated arguments">
                    </div>
                    <p id="loading" class="mt-2 small text-center" style="display:none;">Sending command...</p>
                </div>

                <div class="status-display container">
                    <div class="row g-4 align-items-center">
                        <!-- Left Content Column -->
                        <div class="col-6">
                            <div class="left-info">
                                <div><strong>Location:</strong> <span id="location"></span></div>
                                <div><strong>Items:</strong> <span id="items"></span></div>
                                <div><strong>Weapons:</strong> <span id="weapons"></span></div>
                                <div><strong>Players:</strong> <span id="players"></span></div>
                            </div>
                        </div>

                        <!-- Right Tag Column -->
                        <div class="col-6">
                            <div class="tag-container">
                                <h5 class="m-0 text-left"><strong><span id="tag"></span></strong></h5>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="chat-container">
                    <div class="chat-column">
                        <div class="chat-header">Player Log</div>
                        <div class="chat-box" id="chatBox">
                            <div id="response"></div>
                            <p>Actions will be recorded here.</p>
                        </div>
                    </div>

                    <div class="chat-column">
                        <div class="chat-header">Room Log</div>
                        <div class="chat-box" id="roomLog">
                            <div id="roomActions"></div>
                            <p>Room actions will be recorded here.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/script.js"></script>
<script>
    window.onload = function() {
        // Load player name from localStorage when page loads
        const storedData = JSON.parse(localStorage.getItem("requestBody"));
        if (storedData && storedData.name) {
            document.getElementById('name').value = storedData.name;
        }
    };
</script>
</body>
</html>
